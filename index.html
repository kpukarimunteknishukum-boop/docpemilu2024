<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocuPemilu C.Hasil - 1 Pintu Direct Cam</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-red-700 text-white p-3 shadow-md text-center">
        <h1 class="text-base font-bold">DocuPemilu C.Hasil</h1>
        <p class="text-[11px] text-red-100">Kamera Direct 1 Pintu - Otomatis PDF, Drive & Sheets</p>
    </header>

    <!-- Tampilan Utama (Form & Galeri Pratinjau) -->
    <main id="mainScreen" class="flex-grow p-3 max-w-lg mx-auto w-full space-y-3">
        
        <!-- Form Keterangan Wilayah -->
        <div class="bg-gray-800 p-3 rounded-xl shadow border border-gray-700 space-y-2">
            <h2 class="font-semibold text-xs text-red-400 border-b border-gray-700 pb-1">1. Rincian Wilayah</h2>
            
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">Jenis Pemilihan</label>
                <select id="jenisPemilihan" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white focus:ring-2 focus:ring-red-500">
                    <option value="PPWP">PPWP (Presiden & Wakil Presiden)</option>
                    <option value="DPD RI">DPD RI</option>
                    <option value="DPR RI">DPR RI</option>
                    <option value="DPRD Prov">DPRD Provinsi</option>
                    <option value="DPRD Kab/Kota">DPRD Kabupaten/Kota</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] text-gray-400 mb-1">Kecamatan</label>
                    <input type="text" id="kecamatan" placeholder="Contoh: Tebing" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-[11px] text-gray-400 mb-1">Kelurahan/Desa</label>
                    <input type="text" id="kelurahan" placeholder="Contoh: Kapling" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] text-gray-400 mb-1">Nomor TPS</label>
                    <input type="text" id="tps" placeholder="Contoh: 1" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-[11px] text-gray-400 mb-1">Kabupaten/Kota</label>
                    <input type="text" id="kabupaten" placeholder="Contoh: Karimun" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white">
                </div>
            </div>

            <!-- URL Web App Tertanam Permanen -->
            <input type="hidden" id="scriptUrlInput" value="https://script.google.com/macros/s/AKfycbxe3YKCdcvoLAIjEuyRsWV_fV9z_KhV-A31dmWM0bej9zZYdwZB-cR1tg2WNtwyrBCLRg/exec">
        </div>

        <!-- Tombol Buka Mode Kamera 1 Pintu -->
        <div class="bg-gray-800 p-3 rounded-xl shadow border border-gray-700 space-y-2 text-center">
            <h2 class="font-semibold text-xs text-red-400 border-b border-gray-700 pb-1 text-left">2. Ambil Foto Halaman C.Hasil</h2>
            
            <button onclick="startAppCamera()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 shadow">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span>Buka Kamera Aplikasi</span>
            </button>

            <!-- Pratinjau Daftar Halaman -->
            <div class="text-left pt-2">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs text-gray-300">Total Halaman Terkumpul: <span id="pageCount" class="font-bold text-red-400">0</span></span>
                    <button onclick="clearAllPages()" class="text-[10px] text-red-400 hover:underline">Hapus Semua</button>
                </div>
                <div id="previewContainer" class="grid grid-cols-3 gap-2 max-h-36 overflow-y-auto p-1 border border-gray-700 rounded-lg bg-gray-900">
                    <p class="text-[10px] text-gray-500 col-span-3 text-center py-4">Belum ada foto.</p>
                </div>
            </div>
        </div>

        <!-- Tombol Kirim -->
        <button onclick="submitData()" id="submitBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow text-xs transition disabled:bg-gray-600">
            Kirim & Unggah ke Drive & Sheets
        </button>

        <div id="statusMessage" class="text-center text-xs text-gray-300 font-medium"></div>

    </main>

    <!-- Layar Penuh Kamera Aplikasi (Direct Web Cam Stream - 1 Pintu) -->
    <div id="cameraView" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-between p-3 hidden">
        <!-- Top Bar -->
        <div class="w-full flex justify-between items-center text-white px-2 pt-2">
            <span class="text-xs font-bold text-red-400" id="camTitleInfo">Halaman Ke-1</span>
            <button onclick="stopAppCamera()" class="bg-gray-800 text-white rounded-full px-3 py-1 text-xs border border-gray-600">Selesai / Kembali ✕</button>
        </div>
        
        <!-- Frame Kamera Video Stream -->
        <div class="relative w-full max-w-md flex-grow flex items-center justify-center overflow-hidden bg-black my-2 rounded-xl border border-gray-800 shadow-inner">
            <video id="appVideo" autoplay playsinline muted class="w-full h-full object-contain"></video>
            <canvas id="appCanvas" class="hidden"></canvas>
            
            <!-- Guideline Kotak Pembantu Dokumen -->
            <div class="absolute inset-4 border-2 border-dashed border-red-500/40 rounded-lg pointer-events-none flex items-center justify-center">
                <span class="text-[10px] text-red-400/60 bg-black/50 px-2 py-1 rounded">Posisikan Dokumen C.Hasil di Sini</span>
            </div>
        </div>

        <!-- Tombol Jepret Kamera -->
        <div class="w-full max-w-md pb-4 flex flex-col items-center space-y-2">
            <button onclick="snapPhoto()" class="w-16 h-16 bg-white rounded-full border-4 border-red-600 shadow-xl active:scale-90 transition flex items-center justify-center">
                <div class="w-12 h-12 bg-red-600 rounded-full"></div>
            </button>
            <p class="text-[10px] text-gray-400">Tekan tombol merah untuk mengambil foto</p>
        </div>
    </div>

    <!-- Script Logika Kamera 1 Pintu -->
    <script>
        let appImages = [];
        let streamTrack = null;

        async function startAppCamera() {
            const cameraView = document.getElementById('cameraView');
            const video = document.getElementById('appVideo');
            const camTitleInfo = document.getElementById('camTitleInfo');
            
            camTitleInfo.textContent = `Ambil Foto Halaman Ke-${appImages.length + 1}`;
            cameraView.classList.remove('hidden');

            try {
                // Kunci konfigurasi resolusi video rendah di tingkat hardware stream agar sangat ramah RAM
                const constraints = {
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 960, max: 1280 },
                        height: { ideal: 720, max: 720 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                streamTrack = stream;
                await video.play();
            } catch (err) {
                console.error("Error akses kamera:", err);
                alert("Gagal membuka kamera. Pastikan Anda sudah memberikan izin kamera pada browser HP ini.");
                stopAppCamera();
            }
        }

        function stopAppCamera() {
            const cameraView = document.getElementById('cameraView');
            cameraView.classList.add('hidden');
            if (streamTrack) {
                streamTrack.getTracks().forEach(track => track.stop());
                streamTrack = null;
            }
        }

        function snapPhoto() {
            const video = document.getElementById('appVideo');
            const canvas = document.getElementById('appCanvas');

            if (!video.videoWidth || !video.videoHeight) {
                alert("Kamera belum siap, tunggu 1-2 detik.");
                return;
            }

            // Downscale otomatis gambar ke 750px (teks C.Hasil sangat jelas & aman 100% dari force close)
            const TARGET_WIDTH = 750;
            let scale = TARGET_WIDTH / video.videoWidth;
            if (scale > 1) scale = 1;

            canvas.width = video.videoWidth * scale;
            canvas.height = video.videoHeight * scale;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Kompresi JPEG 50% di latar belakang secara instan
            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.5);
            appImages.push(compressedDataUrl);

            updatePreview();

            // Lanjut ke foto halaman berikutnya atau beri notifikasi
            const camTitleInfo = document.getElementById('camTitleInfo');
            camTitleInfo.textContent = `Berhasil! Ambil Halaman Ke-${appImages.length + 1}`;
        }

        function updatePreview() {
            const container = document.getElementById('previewContainer');
            const pageCount = document.getElementById('pageCount');
            pageCount.textContent = appImages.length;

            if (appImages.length === 0) {
                container.innerHTML = '<p class="text-[10px] text-gray-500 col-span-3 text-center py-4">Belum ada foto.</p>';
                return;
            }

            container.innerHTML = '';
            appImages.forEach((imgSrc, index) => {
                const div = document.createElement('div');
                div.className = 'relative group border border-gray-700 rounded overflow-hidden bg-black aspect-[3/4] flex items-center justify-center';
                div.innerHTML = `
                    <img src="${imgSrc}" class="object-cover w-full h-full">
                    <span class="absolute bottom-1 left-1 bg-black/70 text-white text-[9px] px-1 rounded">Hal ${index + 1}</span>
                    <button onclick="removeImage(${index})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px]">×</button>
                `;
                container.appendChild(div);
            });
        }

        function removeImage(index) {
            appImages.splice(index, 1);
            updatePreview();
        }

        function clearAllPages() {
            if (confirm("Hapus semua foto yang sudah diambil?")) {
                appImages = [];
                updatePreview();
            }
        }

        async function submitData() {
            const jenisPemilihan = document.getElementById('jenisPemilihan').value;
            const kecamatan = document.getElementById('kecamatan').value.trim();
            const kelurahan = document.getElementById('kelurahan').value.trim();
            const tps = document.getElementById('tps').value.trim();
            const kabupaten = document.getElementById('kabupaten').value.trim();
            const scriptUrl = document.getElementById('scriptUrlInput').value.trim();
            const statusMsg = document.getElementById('statusMessage');
            const submitBtn = document.getElementById('submitBtn');

            if (!kecamatan || !kelurahan || !tps) {
                alert("Isi data Kecamatan, Kelurahan, dan Nomor TPS dulu!");
                return;
            }

            if (appImages.length === 0) {
                alert("Ambil minimal 1 foto halaman C.Hasil!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Menyusun PDF...";
            statusMsg.textContent = "Menggabungkan halaman dokumen...";

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                for (let i = 0; i < appImages.length; i++) {
                    if (i > 0) pdf.addPage();
                    const imgData = appImages[i];
                    await new Promise((resolve) => {
                        const img = new Image();
                        img.src = imgData;
                        img.onload = function() {
                            const imgWidth = pageWidth;
                            const imgHeight = (img.height * pageWidth) / img.width;
                            const renderHeight = imgHeight > pageHeight ? pageHeight : imgHeight;
                            pdf.addImage(imgData, 'JPEG', 0, 0, imgWidth, renderHeight);
                            resolve();
                        };
                    });
                }

                const pdfOutput = pdf.output('datauristring');
                const base64Data = pdfOutput.split(',')[1];

                statusMsg.textContent = "Mengunggah ke Drive & Sheets...";
                submitBtn.textContent = "Mengunggah...";

                const payload = {
                    jenisPemilihan: jenisPemilihan,
                    kecamatan: kecamatan,
                    kelurahan: kelurahan,
                    tps: tps,
                    kabupaten: kabupaten,
                    halaman: appImages.length,
                    fileName: "",
                    pdfBase64: base64Data
                };

                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === "success") {
                    statusMsg.innerHTML = `<span class="text-green-400 font-bold">Berhasil diunggah!</span>`;
                    alert("Dokumen C.Hasil berhasil disimpan ke Drive & Sheets!");
                    appImages = [];
                    updatePreview();
                    document.getElementById('tps').value = '';
                } else {
                    throw new Error(result.message || "Gagal di server.");
                }

            } catch (error) {
                console.error(error);
                statusMsg.innerHTML = `<span class="text-red-400 font-bold">Error: ${error.message}</span>`;
                alert("Gagal mengirim: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Kirim & Unggah ke Drive & Sheets";
            }
        }
    </script>
</body>
</html>
